<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGA Leaf — simulated screen</title>
<style>
  :root{--ink:#1e1c19;--paper:#efece4}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2a2622;font:14px/1.4 system-ui,sans-serif;color:#d9d2c5}
  .wrap{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:center;padding:24px}
  .shell{width:300px;padding:22px 18px 30px;border-radius:26px;background:linear-gradient(160deg,#5a4a3c,#3b3129);box-shadow:0 20px 60px #0008, inset 0 1px 0 #fff2;position:relative}
  .btns{position:absolute;top:-6px;left:70px;right:70px;display:flex;justify-content:space-between}
  .btns button{width:34px;height:8px;border:0;border-radius:4px 4px 0 0;background:#2b241e;cursor:pointer}
  .screen{width:240px;height:320px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:4px;padding:12px 12px 22px;box-sizing:border-box;font:13px/1.45 Georgia,serif;overflow:hidden;position:relative}
  .screen h1{font:600 13px system-ui;margin:0 0 8px;border-bottom:1px solid #0002;padding-bottom:6px;display:flex;justify-content:space-between}
  .book{padding:6px 0;border-bottom:1px solid #0001;cursor:pointer}.book b{display:block;font:600 12px system-ui}.book small{font:11px system-ui;color:#666}
  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0001}.bar i{display:block;height:3px;background:#3b3129}
  .foot{position:absolute;bottom:6px;left:12px;right:12px;display:flex;justify-content:space-between;font:10px system-ui;color:#777}
  mark{background:#e8d28a}
  .code{font:600 42px ui-monospace,monospace;letter-spacing:6px;text-align:center;margin:40px 0 10px}
  .row{display:flex;gap:6px;justify-content:center;margin-top:14px}.row button{font:12px system-ui;padding:6px 10px;border-radius:8px;border:0;background:#d9cbb3;cursor:pointer}
  .side{max-width:340px}.side h2{font:600 15px system-ui;margin:0 0 8px;color:#fff}.side pre{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;background:#0003;padding:10px;border-radius:8px;max-height:260px;overflow:auto}
  .tag{display:inline-block;font:11px system-ui;padding:2px 8px;border-radius:99px;background:#c9a54a33;color:#e8c96a;margin-bottom:10px}
</style></head><body><div class="wrap">
<div class="shell"><div class="btns"><button title="Back" onclick="act('back')"></button><button title="Previous page" onclick="act('prev')"></button><button title="Next page" onclick="act('next')"></button><button title="Highlight" onclick="act('hl')"></button></div>
<div class="screen" id="s">…</div>
<div class="row"><button onclick="act('back')">Back</button><button onclick="act('prev')">◀ Prev</button><button onclick="act('next')">Next ▶</button><button onclick="act('hl')">Highlight</button></div></div>
<div class="side"><span class="tag">Simulator, not hardware</span><h2 id="nm">SAGA Leaf</h2><p>This page stands in for the Leaf's 240×320 screen and its four top-edge buttons. Reading here moves the device's own position; SAGA Reader picks it up on the next sync.</p><pre id="log"></pre></div></div>
<script>
let st={};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function post(p,b){await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})})}
async function act(a){if(a==='back')await post('/sim/back');if(st.view==='reading'){if(a==='next')await post('/sim/turn',{pages:1});if(a==='prev')await post('/sim/turn',{pages:-1});if(a==='hl')await post('/sim/highlight',{})}draw()}
async function open_(id){await post('/sim/open',{bookId:id});draw()}
async function draw(){st=await (await fetch('/sim/screen')).json();$('nm').textContent=st.name;$('log').textContent=(st.log||[]).join('\n');const s=$('s');
 if(st.view==='pairing'){s.innerHTML=`<h1>Pair a device</h1><p style="font:12px system-ui">${esc(st.client)} wants to connect. Enter this code in the app:</p><div class="code">${st.code}</div><p style="font:11px system-ui;color:#666;text-align:center">Code expires in 2 minutes</p>`;return}
 if(st.view==='reading'){let t=esc(st.text);for(const h of st.highlights||[]){const e=esc(h);if(e.length>8&&t.includes(e))t=t.replace(e,'<mark>'+e+'</mark>')}s.innerHTML=`<div style="white-space:pre-wrap">${t}</div><div class="foot"><span>${esc(st.title).slice(0,22)}</span><span>${Math.round(st.progress*100)}%</span></div><div class="bar"><i style="width:${st.progress*100}%"></i></div>`;return}
 s.innerHTML=`<h1><span>Library</span><span>${st.battery!=null?st.battery+'%':''}</span></h1>`+(st.books.length?st.books.map(b=>`<div class="book" onclick="open_('${b.id}')"><b>${esc(b.title)}</b><small>${esc(b.author)} · ${Math.round((b.progress||0)*100)}%</small></div>`).join(''):'<p style="font:12px system-ui;color:#666">No books yet. Send one from SAGA Reader.</p>')}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')act('next');if(e.key==='ArrowLeft')act('prev');if(e.key==='h')act('hl');if(e.key==='Escape')act('back')});
draw();setInterval(draw,1500);
</script></body></html>
